name: Build sing-box CLI

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: 'Optional commit hash (empty = latest commit on default branch)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.commit_hash || 'latest' }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.x'
  REPO: Uevo001/sing-box

jobs:
  build:
    name: Build static linux-amd64-v3
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.commit_hash }}" ]]; then
            REF="${{ inputs.commit_hash }}"
          else
            # latest commit on default branch
            REF=$(gh api "repos/${{ env.REPO }}" --jq '.default_branch')
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Using ref: ${REF}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          ref: ${{ steps.resolve.outputs.ref }}
          path: sing-box
          fetch-depth: 1

      - name: Record version info
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git -C sing-box rev-parse HEAD)
          SHORT=${SHA:0:7}
          # try to read version from constant if present, otherwise use short sha
          VER=""
          if [[ -f sing-box/constant/version.go ]]; then
            VER=$(grep -oP 'Version\s*=\s*"\K[^"]+' sing-box/constant/version.go 2>/dev/null || true)
          fi
          if [[ -z "${VER}" ]]; then
            VER="git-${SHORT}"
          fi
          echo "source_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "SHA=${SHA}  version=${VER}"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: sing-box/go.sum

      - name: Compute tags & ldflags
        id: env
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f sing-box/release/DEFAULT_BUILD_TAGS ]]; then
            TAGS=$(cat sing-box/release/DEFAULT_BUILD_TAGS)
          else
            TAGS="with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,badlinkname,tfogo_checklinkname0"
          fi
          # strip naive / purego / musl (not needed for static pure-Go build)
          TAGS=$(echo "$TAGS" | sed -E 's/,?with_naive_outbound//g; s/,?with_purego//g; s/,?with_musl//g; s/^,//; s/,$//')

          LDFLAGS=""
          if [[ -f sing-box/release/LDFLAGS ]]; then
            LDFLAGS=$(cat sing-box/release/LDFLAGS)
          else
            LDFLAGS="-checklinkname=0"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "ldflags=${LDFLAGS}" >> "$GITHUB_OUTPUT"
          echo "Tags: ${TAGS}"
          echo "LDFLAGS: ${LDFLAGS}"

      - name: Build (static, amd64-v3, size-optimized)
        shell: bash
        run: |
          set -xeuo pipefail
          cd sing-box
          mkdir -p dist

          export CGO_ENABLED=0
          export GOOS=linux
          export GOARCH=amd64
          export GOAMD64=v3

          go build -v -trimpath \
            -o dist/sing-box \
            -tags "${{ steps.env.outputs.tags }}" \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${{ steps.meta.outputs.version }} ${{ steps.env.outputs.ldflags }} -s -w -buildid=" \
            ./cmd/sing-box

          ls -lh dist/sing-box
          file dist/sing-box
          # confirm mostly static
          ldd dist/sing-box 2>&1 || true

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          cd sing-box/dist
          DIR="sing-box-${{ steps.meta.outputs.version }}-linux-amd64v3-static"
          mkdir -p "$DIR"
          cp ../LICENSE "$DIR/" 2>/dev/null || true
          cp sing-box "$DIR/"
          tar -czvf "${DIR}.tar.gz" "$DIR"
          rm -rf "$DIR" sing-box
          ls -lh
          sha256sum *.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-amd64v3-static-${{ steps.meta.outputs.short }}
          path: sing-box/dist/*
          if-no-files-found: error
